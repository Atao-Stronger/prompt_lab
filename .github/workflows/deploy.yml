name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prompt-lab-production
  cancel-in-progress: true

env:
  DEPLOY_HOST: 121.43.126.201
  DEPLOY_USER: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH_KEY secret
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "缺少仓库 Secret：SSH_KEY（内容是部署私钥全文）" >&2
            exit 1
          fi

      - name: Install ssh key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync source
        run: |
          rsync -avzr --delete \
            --exclude=.git --exclude=.env --exclude=data \
            --exclude=.deploy --exclude=__pycache__ \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/prompt_lab/"

      - name: Rebuild and restart
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            cd /opt/prompt_lab
            (
              set -e
              docker compose up -d --build
              docker compose ps
              docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/api/health\")"
            ) > /tmp/ci-deploy.log 2>&1
            rc=$?
            tail -25 /tmp/ci-deploy.log
            exit $rc
          '
