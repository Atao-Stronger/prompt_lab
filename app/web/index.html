<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt 库</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="d-none">
    <nav class="navbar bg-white border-bottom sticky-top">
      <div class="container-fluid flex-nowrap gap-2">
        <span class="navbar-brand fw-bold mb-0 d-flex align-items-center gap-2">
          <img src="./logo.svg" alt="" width="26" height="26" />
          Prompt 库
        </span>
        <input id="search" class="form-control search-input" type="search"
          placeholder="搜索分类、正文…（按 / 聚焦）" autocomplete="off" />
        <div class="d-flex align-items-center gap-2">
          <button id="btn-new" class="btn btn-primary d-none">新建</button>
          <button id="btn-login" class="btn btn-outline-secondary">管理员登录</button>
          <button id="btn-logout" class="btn btn-link text-secondary text-decoration-none px-2 d-none">退出</button>
        </div>
      </div>
    </nav>

    <div class="layout">
      <aside class="sidebar border-end bg-white">
        <div id="sidebar" class="list-group list-group-flush"></div>
      </aside>
      <main class="content">
        <div id="list"></div>
        <div id="empty" class="empty-state d-none">
          <h2 class="h5">还没有提示词</h2>
          <p class="text-secondary small mb-0">按 Ctrl+N 或点右上角「新建」创建第一条。</p>
        </div>
      </main>
    </div>
  </div>

  <!-- 编辑 / 新建 -->
  <div class="modal fade" id="editor-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editor-title">新建提示词</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">分类</label>
            <input id="f-category" class="form-control" list="category-list" maxlength="40"
              placeholder="选择已有分类，或直接输入新分类" autocomplete="off" />
            <datalist id="category-list"></datalist>
          </div>
          <div class="mb-2">
            <label class="form-label">正文 <span class="text-secondary fw-normal small">支持 Markdown</span></label>
            <textarea id="f-content" class="form-control code-input" rows="12"
              placeholder="支持 Markdown：标题、列表、代码块、引用等"></textarea>
          </div>
          <div id="f-note-wrap" class="d-none mt-3">
            <label class="form-label">本次修改说明 <span class="text-secondary fw-normal small">可选</span></label>
            <input id="f-note" class="form-control" placeholder="写入版本记录" />
          </div>
        </div>
        <div class="modal-footer justify-content-between">
          <div>
            <button id="btn-delete" class="btn btn-outline-danger">删除</button>
            <button id="btn-history" class="btn btn-outline-secondary ms-2">历史</button>
          </div>
          <div>
            <button class="btn btn-light" data-bs-dismiss="modal">取消</button>
            <button id="btn-save" class="btn btn-primary ms-2">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="modal fade" id="history-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">历史版本</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div id="history-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 管理员登录 -->
  <div class="modal fade" id="login-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <form id="login-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title d-flex align-items-center gap-2">
              <img src="./logo.svg" alt="" width="22" height="22" />
              管理员登录
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
          </div>
          <div class="modal-body">
            <input id="login-token" type="password" class="form-control" placeholder="访问口令" autocomplete="current-password" />
            <p id="login-error" class="text-danger small mt-2 mb-0"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary ms-2">进入</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 详情 -->
  <div class="modal fade" id="detail-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="d-flex align-items-center gap-2">
            <span id="detail-category" class="badge rounded-pill text-bg-light fw-normal"></span>
            <span id="detail-usage" class="text-secondary small"></span>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div id="detail-body" class="markdown"></div>
        </div>
        <div class="modal-footer justify-content-between">
          <button id="detail-delete" class="btn btn-outline-danger d-none">删除</button>
          <div>
            <button id="detail-edit" class="btn btn-light d-none">编辑</button>
            <button id="detail-copy" class="btn btn-primary ms-2">复制</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite">
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>

  <script src="./vendor/bootstrap.bundle.min.js"></script>
  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
