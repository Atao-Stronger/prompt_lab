<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt 库</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <h1>Prompt 库</h1>
      <p class="muted">输入访问口令进入</p>
      <input id="login-token" type="password" placeholder="访问口令" autocomplete="current-password" />
      <button type="submit" class="btn primary block">进入</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">Prompt 库</div>
      <input id="search" class="search" type="search" placeholder="搜索标题、标签、正文…   按 / 聚焦" autocomplete="off" />
      <div class="top-actions">
        <button id="btn-new" class="btn primary" title="新建 (Ctrl+N)">新建</button>
        <button id="btn-export" class="btn" title="导出 JSON">导出</button>
        <button id="btn-import" class="btn" title="导入 JSON">导入</button>
        <button id="btn-logout" class="btn ghost" title="退出">退出</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <section class="content">
        <div id="list" class="list"></div>
        <div id="empty" class="empty hidden">
          <h2>还没有提示词</h2>
          <p class="muted">按 Ctrl+N 或点右上角「新建」创建第一条。</p>
        </div>
      </section>
    </main>
  </div>

  <div id="drawer-mask" class="mask hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-label="编辑提示词">
    <div class="drawer-head">
      <h2 id="drawer-title">新建提示词</h2>
      <button id="drawer-close" class="icon-btn" title="关闭 (Esc)">×</button>
    </div>
    <div class="drawer-body">
      <label>标题<input id="f-title" maxlength="200" /></label>
      <label>说明<input id="f-desc" maxlength="200" placeholder="一句话用途，可留空" /></label>
      <div class="row">
        <label>分类<select id="f-category"></select></label>
        <label class="grow">标签<input id="f-tags" placeholder="逗号分隔，如 review, Python" /></label>
      </div>
      <label>正文<textarea id="f-content" rows="14" placeholder="支持 {{变量}} 占位符"></textarea></label>
      <div id="f-vars" class="vars muted"></div>
      <label id="f-note-wrap" class="hidden">本次修改说明<input id="f-note" placeholder="可选，写入版本记录" /></label>
    </div>
    <div class="drawer-foot">
      <button id="btn-delete" class="btn danger">删除</button>
      <div class="spacer"></div>
      <button id="btn-history" class="btn">历史</button>
      <button id="btn-save" class="btn primary">保存 (Ctrl+S)</button>
    </div>
  </aside>

  <div id="copy-mask" class="mask hidden"></div>
  <div id="copy-modal" class="modal hidden" role="dialog" aria-modal="true">
    <h2 id="copy-title"></h2>
    <div id="copy-fields" class="fields"></div>
    <div class="modal-foot">
      <span class="muted small">Ctrl+Enter 复制</span>
      <div class="spacer"></div>
      <button id="copy-cancel" class="btn">取消</button>
      <button id="copy-confirm" class="btn primary">复制</button>
    </div>
  </div>

  <div id="history-mask" class="mask hidden"></div>
  <div id="history-modal" class="modal wide hidden" role="dialog" aria-modal="true">
    <h2>历史版本</h2>
    <div id="history-list" class="history-list"></div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button id="history-close" class="btn">关闭</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="./app.js" defer></script>
</body>
</html>
