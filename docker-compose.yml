services:
  app:
    build: ./app
    container_name: prompt_lab
    restart: unless-stopped
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:?ACCESS_TOKEN is required}
      DB_PATH: /data/prompt_lab.db
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')
      interval: 30s
      timeout: 5s
      retries: 3

# 本服务只使用自己的默认网络 prompt_lab_default，不加入其他项目的网络。
# 独立网关 /opt/gateway 会接入该网络，把 https://promptlab.zhongtao.me 转发过来。
